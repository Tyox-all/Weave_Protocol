# .github/workflows/publish-all.yml
# Publishes ALL packages to npm with provenance attestation.
# Manual trigger only. Requires each package's version to be bumped in
# package.json before running (npm publish errors if the version already exists).
#
# Auth: npm Trusted Publishing (OIDC). Each package needs a Trusted
# Publisher on npmjs.com pointing at this workflow (publish-all.yml) with
# "Allow npm publish" checked; packages without one fail their job.
#
# For yoxallismus: published with --tag beta to preserve the stub-as-latest
# labeling strategy. All other packages published as latest.
#
# Supply-chain artifacts per package:
#   - CycloneDX SBOM (npm sbom), uploaded as the `sbom-<package>` artifact
#   - Sigstore-signed GitHub attestations for the exact tarball published:
#     SLSA build provenance + the SBOM. Verify with:
#       gh attestation verify <tarball> -R Tyox-all/Weave_Protocol
#       gh attestation verify <tarball> -R Tyox-all/Weave_Protocol \
#         --predicate-type https://cyclonedx.org/bom
#   - npm registry provenance (--provenance), also Sigstore-backed
#
# Which packages run: by default, only those whose package.json version is
# not yet on npm (so a release runs exactly the jobs it needs). Pass a
# comma-separated "packages" input to force a specific list.
name: Publish All Packages
on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated package dirs, or "unpublished" for every package whose version is not on npm yet'
        required: false
        default: 'unpublished'

permissions:
  contents: read
  id-token: write       # Sigstore keyless signing (npm provenance + attestations)
  attestations: write   # actions/attest-build-provenance, actions/attest-sbom

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Pick packages
        id: pick
        env:
          REQUESTED: ${{ inputs.packages }}   # via env, never inlined into the script
        run: |
          ALL="mund hord domere witan hundredmen tollere langchain api full cli ward adapter-claudecode adapter-antigravity adapter-msaf browser adversary agentsecbench yoxallismus"
          PICK=""
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "unpublished" ]; then
            for p in $ALL; do
              name=$(node -p "require('./$p/package.json').name")
              version=$(node -p "require('./$p/package.json').version")
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "  skip    $name@$version (already on npm)"
              else
                echo "  publish $name@$version"
                PICK="$PICK $p"
              fi
            done
          else
            for p in $(echo "$REQUESTED" | tr ',' ' '); do
              case " $ALL " in
                *" $p "*) PICK="$PICK $p" ;;
                *) echo "::error::Unknown package '$p'"; exit 1 ;;
              esac
            done
          fi
          JSON=$(node -e 'console.log(JSON.stringify(process.argv.slice(1)))' $PICK)
          echo "packages=$JSON" >> "$GITHUB_OUTPUT"
          echo "Publishing: $JSON"

  publish-all:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
      fail-fast: false  # Continue publishing other packages if one fails

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.package }}
        run: npm run build

      - name: Pack
        id: pack
        working-directory: ${{ matrix.package }}
        run: echo "tarball=$(npm pack --json | jq -r '.[0].filename')" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM
        working-directory: ${{ matrix.package }}
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json

      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.package }}/${{ steps.pack.outputs.tarball }}

      - name: Attest SBOM (Sigstore)
        uses: actions/attest-sbom@v2
        with:
          subject-path: ${{ matrix.package }}/${{ steps.pack.outputs.tarball }}
          sbom-path: ${{ matrix.package }}/sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.package }}
          path: |
            ${{ matrix.package }}/sbom.cdx.json
            ${{ matrix.package }}/${{ steps.pack.outputs.tarball }}

      # Publish the attested tarball itself so the attestation digest
      # matches what lands on the registry byte-for-byte.
      - name: Publish (yoxallismus → @beta tag)
        if: matrix.package == 'yoxallismus'
        working-directory: ${{ matrix.package }}
        run: npm publish "./${{ steps.pack.outputs.tarball }}" --tag beta --provenance --access public --loglevel verbose
        env:
          # Trusted Publishing (OIDC): clear setup-node's placeholder token
          # so npm doesn't send it instead of exchanging an OIDC token.
          NODE_AUTH_TOKEN: ''

      - name: Publish (all other packages → latest)
        if: matrix.package != 'yoxallismus'
        working-directory: ${{ matrix.package }}
        run: npm publish "./${{ steps.pack.outputs.tarball }}" --provenance --access public --loglevel verbose
        env:
          # Trusted Publishing (OIDC): clear setup-node's placeholder token
          # so npm doesn't send it instead of exchanging an OIDC token.
          NODE_AUTH_TOKEN: ''

      - name: Success
        run: echo "✅ Published @weave_protocol/${{ matrix.package }} with provenance, SBOM and attestations"
