# .github/workflows/publish-all.yml
# Publishes ALL packages to npm with provenance attestation.
# Manual trigger only. Requires each package's version to be bumped in
# package.json before running (npm publish errors if the version already exists).
#
# Auth: npm Trusted Publishing (OIDC). Each package needs a Trusted
# Publisher on npmjs.com pointing at this workflow (publish-all.yml) with
# "Allow npm publish" checked; packages without one fail their job.
#
# For yoxallismus: published with --tag beta to preserve the stub-as-latest
# labeling strategy. All other packages published as latest.
name: Publish All Packages
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-all:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [mund, hord, domere, witan, hundredmen, tollere, langchain, api, full, cli, ward, adapter-claudecode, adapter-antigravity, adapter-msaf, browser, adversary, agentsecbench, yoxallismus]
      fail-fast: false  # Continue publishing other packages if one fails

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.package }}
        run: npm run build

      - name: Publish (yoxallismus → @beta tag)
        if: matrix.package == 'yoxallismus'
        working-directory: ${{ matrix.package }}
        run: npm publish --tag beta --provenance --access public
        env:
          # Trusted Publishing (OIDC): clear setup-node's placeholder token
          # so npm doesn't send it instead of exchanging an OIDC token.
          NODE_AUTH_TOKEN: ''

      - name: Publish (all other packages → latest)
        if: matrix.package != 'yoxallismus'
        working-directory: ${{ matrix.package }}
        run: npm publish --provenance --access public
        env:
          # Trusted Publishing (OIDC): clear setup-node's placeholder token
          # so npm doesn't send it instead of exchanging an OIDC token.
          NODE_AUTH_TOKEN: ''

      - name: Success
        run: echo "✅ Published @weave_protocol/${{ matrix.package }} with provenance"
