name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  # Every npm package: clean install, build, run its tests (if it has any),
  # and fail on critical production advisories. Yoxallismus' suite includes
  # the yoxall/2 known-answer vectors, so this job keeps that wire format locked.
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [mund, hord, domere, witan, hundredmen, tollere, ward, langchain, api, cli, full, browser, adversary, agentsecbench, yoxallismus, adapter-claudecode, adapter-antigravity, adapter-msaf]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: |
          if npm pkg get scripts.test | grep -q '{}'; then
            echo "::warning title=No tests::${{ matrix.package }} has no test suite"
          else
            npm test
          fi
      # Importing a package must not start a server or print anything (servers
      # live behind the bin). full only re-exports the published packages; witan
      # is exempt until its lockfile moves to a domere release with this fix.
      - name: Import has no side effects
        if: matrix.package != 'full' && matrix.package != 'witan'
        env:
          YOXALL_SILENCE_BETA_WARNING: '1'  # yoxallismus' deliberate one-time beta notice
        run: |
          main=$(node -p "const p=require('./package.json'); (p.exports?.['.']?.import || p.main || '').replace(/^\.\//,'')")
          [ -n "$main" ] && [ -f "$main" ] || { echo "no main entry"; exit 0; }
          out=$(node --input-type=module -e "const t=setTimeout(()=>{console.log('still running after 8s');process.exit(3)},8000); await import('./$main'); clearTimeout(t);" </dev/null 2>&1) || { echo "::error::import of $main failed: $out"; exit 1; }
          [ -z "$out" ] || { echo "::error::import of $main printed output: $out"; exit 1; }
      # Critical only for now: api/full still pull zod 3 through published
      # hord/mund until those releases go out; then raise this to high.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=critical

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llamaindex-py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: pytest -q
